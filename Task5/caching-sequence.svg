<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:30px;font-weight:700}.h{font-size:17px;font-weight:700}.t{font-size:14px}.small{font-size:13px}
.actor{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:8}.lifeline{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}.msg{stroke:#334155;stroke-width:2;marker-end:url(#a)}.ret{stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}
.alt{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5;rx:8}.tx{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5;rx:8}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text x="45" y="48" class="title">Sequence diagram: чтение списка и изменение статуса</text>

<!-- participants -->
<g>
<rect x="40" y="85" width="170" height="55" class="actor"/><text x="85" y="118" class="h">Operator</text>
<rect x="310" y="85" width="190" height="55" class="actor"/><text x="350" y="118" class="h">MES Frontend</text>
<rect x="610" y="85" width="190" height="55" class="actor"/><text x="655" y="118" class="h">MES Backend</text>
<rect x="920" y="85" width="160" height="55" class="actor"/><text x="970" y="118" class="h">Redis</text>
<rect x="1190" y="85" width="170" height="55" class="actor"/><text x="1240" y="118" class="h">MES DB</text>
<rect x="1460" y="85" width="250" height="55" class="actor"/><text x="1507" y="118" class="h">Outbox Publisher / MQ</text>
</g>
<g>
<line x1="125" y1="140" x2="125" y2="1240" class="lifeline"/>
<line x1="405" y1="140" x2="405" y2="1240" class="lifeline"/>
<line x1="705" y1="140" x2="705" y2="1240" class="lifeline"/>
<line x1="1000" y1="140" x2="1000" y2="1240" class="lifeline"/>
<line x1="1275" y1="140" x2="1275" y2="1240" class="lifeline"/>
<line x1="1585" y1="140" x2="1585" y2="1240" class="lifeline"/>
</g>

<text x="45" y="190" class="h">A. Чтение списка заказов</text>
<line x1="125" y1="235" x2="405" y2="235" class="msg"/><text x="175" y="225" class="t">Открыть dashboard</text>
<line x1="405" y1="285" x2="705" y2="285" class="msg"/><text x="455" y="275" class="t">GET /orders?status=...</text>
<line x1="705" y1="335" x2="1000" y2="335" class="msg"/><text x="765" y="325" class="t">GET cache key</text>

<rect x="665" y="365" width="650" height="255" class="alt"/>
<text x="680" y="390" class="h">alt Cache HIT / MISS</text>
<line x1="1000" y1="430" x2="705" y2="430" class="ret"/><text x="780" y="420" class="t">HIT: cached page</text>
<line x1="705" y1="475" x2="405" y2="475" class="ret"/><text x="500" y="465" class="t">200 + orders</text>
<text x="680" y="515" class="small">MISS:</text>
<line x1="705" y1="550" x2="1275" y2="550" class="msg"/><text x="870" y="540" class="t">optimized SELECT + LIMIT</text>
<line x1="1275" y1="585" x2="705" y2="585" class="ret"/><text x="900" y="575" class="t">orders</text>
<line x1="705" y1="610" x2="1000" y2="610" class="msg"/><text x="770" y="600" class="t">SET key EX ~30s</text>

<text x="45" y="700" class="h">B. Изменение статуса заказа</text>
<line x1="125" y1="745" x2="405" y2="745" class="msg"/><text x="175" y="735" class="t">Взять заказ в работу</text>
<line x1="405" y1="795" x2="705" y2="795" class="msg"/><text x="470" y="785" class="t">PATCH /orders/{id}/status</text>

<rect x="1085" y="825" width="385" height="160" class="tx"/>
<text x="1100" y="850" class="h">Одна DB transaction</text>
<line x1="705" y1="885" x2="1275" y2="885" class="msg"/><text x="850" y="875" class="t">UPDATE order status</text>
<line x1="705" y1="930" x2="1275" y2="930" class="msg"/><text x="845" y="920" class="t">INSERT OrderStatusChanged INTO outbox</text>
<line x1="1275" y1="970" x2="705" y2="970" class="ret"/><text x="1000" y="960" class="t">COMMIT OK</text>

<line x1="705" y1="1035" x2="1000" y2="1035" class="msg"/><text x="745" y="1025" class="t">DEL old status key</text>
<line x1="705" y1="1075" x2="1000" y2="1075" class="msg"/><text x="745" y="1065" class="t">DEL new status key</text>
<line x1="705" y1="1125" x2="405" y2="1125" class="ret"/><text x="500" y="1115" class="t">200 OK</text>

<line x1="1585" y1="1175" x2="1275" y2="1175" class="msg"/><text x="1330" y="1165" class="t">read unsent outbox</text>
<line x1="1275" y1="1215" x2="1585" y2="1215" class="msg"/><text x="1355" y="1205" class="t">publish → RabbitMQ → confirm</text>
<text x="45" y="1270" class="small">Если Redis недоступен, invalidation/fill не ломает write-path; TTL ограничивает stale window.</text>
</svg>