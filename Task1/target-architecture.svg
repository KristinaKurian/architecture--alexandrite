<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#1f2937 }
.title { font-size:32px; font-weight:700 }
.h { font-size:20px; font-weight:700 }
.t { font-size:16px }
.small { font-size:14px }
.box { fill:#ffffff; stroke:#334155; stroke-width:2; rx:14 }
.new { fill:#eff6ff; stroke:#2563eb; stroke-width:2.5; rx:14 }
.queue { fill:#fff7ed; stroke:#ea580c; stroke-width:2.5; rx:14 }
.db { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:14 }
.obs { fill:#f0fdf4; stroke:#16a34a; stroke-width:2.5; rx:14 }
.arrow { stroke:#475569; stroke-width:2.2; fill:none; marker-end:url(#a) }
.async { stroke:#ea580c; stroke-width:2.2; stroke-dasharray:8 6; fill:none; marker-end:url(#a) }
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<text x="60" y="58" class="title">«Александрит»: целевая архитектура через 6 месяцев</text>
<text x="60" y="88" class="small">Эволюционная модернизация: надёжность заказов, изоляция B2B, async pricing, быстрый dashboard и observability</text>

<rect x="80" y="140" width="240" height="95" class="box"/><text x="128" y="180" class="h">B2C клиенты</text><text x="118" y="210" class="t">Online Shop frontend</text>
<rect x="80" y="310" width="240" height="95" class="box"/><text x="126" y="350" class="h">B2B партнёры</text><text x="123" y="380" class="t">External API clients</text>

<rect x="420" y="140" width="260" height="95" class="box"/><text x="476" y="180" class="h">Online Shop API</text><text x="480" y="210" class="t">Java / stateless</text>
<rect x="420" y="310" width="260" height="95" class="new"/><text x="490" y="350" class="h">API Gateway</text><text x="472" y="380" class="t">Rate limits · quotas</text>
<rect x="770" y="310" width="270" height="95" class="new"/><text x="815" y="350" class="h">Partner / Order API</text><text x="815" y="380" class="t">202 Accepted · status</text>

<rect x="770" y="470" width="270" height="95" class="queue"/><text x="830" y="510" class="h">Pricing Queue</text><text x="823" y="540" class="t">Backpressure / buffer</text>
<rect x="1120" y="430" width="300" height="135" class="new"/><text x="1195" y="472" class="h">Pricing Workers</text><text x="1180" y="504" class="t">Horizontal scaling</text><text x="1166" y="534" class="small">uses MES pricing logic</text>

<rect x="770" y="650" width="270" height="115" class="box"/><text x="874" y="690" class="h">MES</text><text x="826" y="720" class="t">Production core</text><text x="815" y="748" class="small">Outbox · idempotency</text>
<rect x="1120" y="650" width="300" height="115" class="db"/><text x="1194" y="690" class="h">MES DB</text><text x="1175" y="720" class="t">Primary / HA</text><text x="1152" y="748" class="small">optimized indexes</text>

<rect x="770" y="845" width="270" height="110" class="queue"/><text x="839" y="885" class="h">RabbitMQ</text><text x="808" y="915" class="t">Quorum · retry · DLQ</text><text x="825" y="940" class="small">publisher confirms</text>
<rect x="1120" y="845" width="300" height="110" class="box"/><text x="1228" y="885" class="h">CRM</text><text x="1178" y="915" class="t">Java / stateless</text><text x="1167" y="940" class="small">Outbox · idempotency</text>

<rect x="80" y="625" width="260" height="125" class="new"/><text x="123" y="668" class="h">Dashboard read path</text><text x="112" y="700" class="t">Redis / read model</text><text x="110" y="730" class="small">hot first page by status</text>

<rect x="80" y="845" width="530" height="110" class="obs"/><text x="205" y="885" class="h">Observability</text><text x="126" y="917" class="t">Metrics · Logs · Tracing · Alerts</text><text x="128" y="944" class="small">order_id · correlation_id · event_id</text>

<path d="M320 187 L420 187" class="arrow"/>
<path d="M320 357 L420 357" class="arrow"/>
<path d="M680 357 L770 357" class="arrow"/>
<path d="M905 405 L905 470" class="async"/>
<path d="M1040 518 L1120 500" class="async"/>
<path d="M1270 565 L1010 650" class="arrow"/>
<path d="M1040 707 L1120 707" class="arrow"/>
<path d="M905 765 L905 845" class="async"/>
<path d="M1040 900 L1120 900" class="async"/>
<path d="M1120 900 L1040 900" class="async"/>
<path d="M770 705 L340 688" class="arrow"/>
<path d="M420 187 C360 187 360 650 770 690" class="arrow"/>

<text x="1080" y="615" class="small">Source of truth</text>
<text x="1050" y="820" class="small">reliable domain events</text>
</svg>